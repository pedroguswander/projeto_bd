services:
  db:
    image: mysql:8.4
    container_name: streaming-db
    restart: unless-stopped
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: ${DB_NAME:-StreamingAtualizado2}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - streaming_mysql_data:/var/lib/mysql
      - ./serivco_streaming/createAndInsertAtualizado.sql:/docker-entrypoint-initdb.d/01-create-and-insert.sql:ro
      - ./docker/mysql/init/02-views-routines-triggers.sql:/docker-entrypoint-initdb.d/02-views-routines-triggers.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./serivco_streaming
    container_name: streaming-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-StreamingAtualizado2}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: streaming-frontend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      WDS_SOCKET_PORT: 0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  streaming_mysql_data:
